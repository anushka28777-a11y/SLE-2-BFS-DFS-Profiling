name: Generate Py-Spy Flame Graph

on:
  push:
    branches: [main]
    paths-ignore:
      - "bfs_dfs_flame.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Py-Spy
        run: python -m pip install py-spy

      - name: Generate Py-Spy flame graph
        run: |
          py-spy record \
            --rate 100 \
            --duration 15 \
            --output bfs_dfs_flame.svg \
            -- python -c "import bfs_dfs_profiling as p; p.profiling_workload(5000000)" \
            || test -s bfs_dfs_flame.svg

      - name: Verify flame graph
        run: |
          test -s bfs_dfs_flame.svg
          grep -q "<svg" bfs_dfs_flame.svg

      - name: Commit flame graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bfs_dfs_flame.svg
          git diff --cached --quiet || git commit -m "Add Py-Spy BFS DFS flame graph"
          git push
